name: mutation

# Informational mutation testing: manual only, never on PRs, never a required
# check. A low score never fails the job; zero kills does, because that means
# the runner is broken (a Vitest major once made Stryker run zero tests per mutant).

on:
  workflow_dispatch:
    inputs:
      mutate:
        description: 'Glob to mutate (default: every file in stryker.config.mjs)'
        required: false
        default: ''

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Stryker
        env:
          MUTATE: ${{ inputs.mutate }}
        run: |
          if [ -n "$MUTATE" ]; then npx stryker run --mutate "$MUTATE"; else npx stryker run; fi
      - name: Runner sanity (kills > 0)
        run: |
          killed="$(jq '[.files[].mutants[] | select(.status == "Killed")] | length' reports/mutation/mutation.json)"
          echo "killed=$killed"
          [ "$killed" -gt 0 ] || { echo "Stryker killed nothing: the test runner is not running tests per mutant."; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
