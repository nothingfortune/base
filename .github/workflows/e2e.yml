name: e2e

# Draft-skipped Playwright layer; dormant until this repo has a
# playwright.config.*. Run the reviews-done gate as DRAFT_SKIPPED_CHECK=e2e.
#
# `e2e / e2e` is a required check, so this job has no `if:`. A skipped job
# that calls a reusable workflow reports as `e2e`, never `e2e / e2e`, which
# left doc-only PRs blocked forever. The shared workflow skips drafts inside,
# where the skip keeps the full name. Doc-only PRs run it too: a no-op until
# Playwright is adopted.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# PRs supersede their own runs; every main push gets its own group so none is cancelled.
concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    uses: nothingfortune/workflows/.github/workflows/e2e.yml@125089c3642893f0995161f7eaf16b45df8cf05b # v1.3.0
