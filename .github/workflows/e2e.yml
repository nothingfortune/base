name: e2e

# Draft-skipped Playwright layer; dormant until this repo has a
# playwright.config.*. Run the reviews-done gate as DRAFT_SKIPPED_CHECK=e2e.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    uses: nothingfortune/workflows/.github/workflows/e2e.yml@1f28f5a63001481511a35d5d278ec2198a2da245 # v1
