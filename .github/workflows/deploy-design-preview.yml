name: Deploy design preview

# Publishes docs/designs/suite/ to Cloudflare Pages (main -> production,
# branches -> previews); skips until CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID are set. Setup: docs/designs/suite/README.md.

on:
  push:
    paths:
      - 'docs/designs/suite/**'
  workflow_dispatch:

concurrency:
  group: design-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  configured:
    # Dependabot pushes carry no repository secrets, so the deploy could only fail there.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bin/design-preview-ready.sh

  deploy:
    needs: configured
    if: needs.configured.outputs.ready == 'true'
    uses: nothingfortune/workflows/.github/workflows/deploy-design-preview.yml@125089c3642893f0995161f7eaf16b45df8cf05b # v1.3.0
    with:
      path: docs/designs/suite
    # Explicit mapping: `inherit` is rejected for a required secret when the caller is in another org.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
