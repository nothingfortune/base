name: Deploy design preview

# Publishes docs/designs/suite/ to Cloudflare Pages (main -> production,
# branches -> previews); skips until CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID are set. Setup: docs/designs/suite/README.md.

on:
  push:
    paths:
      - 'docs/designs/suite/**'
  workflow_dispatch:

concurrency:
  group: design-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  configured:
    # Dependabot pushes carry no repository secrets, so the deploy could only fail there.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets not set; skipping the design preview deploy."
          fi

  deploy:
    needs: configured
    if: needs.configured.outputs.ready == 'true'
    uses: nothingfortune/workflows/.github/workflows/deploy-design-preview.yml@aa7a3a0ecc927c178fc5f6df2727026234c1145c # v1.2.0
    with:
      path: docs/designs/suite
    # Explicit mapping: `inherit` is rejected for a required secret when the caller is in another org.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
