name: Deploy design preview

# Dormant until docs/designs/handoff/ exists. Pages project auto-named
# <repo>-design; repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    paths:
      - 'docs/designs/handoff/**'
  workflow_dispatch:

concurrency:
  group: design-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: nothingfortune/workflows/.github/workflows/deploy-design-preview.yml@93eb4896f38d60399fe61a7e4729bbe5ea0420db # v1
    secrets: inherit
