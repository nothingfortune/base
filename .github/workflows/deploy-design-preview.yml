name: Deploy design preview

# Dormant until docs/designs/handoff/ exists. Pages project auto-named
# <repo>-design; repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    paths:
      - 'docs/designs/handoff/**'
  workflow_dispatch:

concurrency:
  group: design-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: nothingfortune/workflows/.github/workflows/deploy-design-preview.yml@102318a26f52e74480fc0006317dbc6bb4b14897 # v1.1.1
    # Explicit mapping: `inherit` is rejected for a required secret when the caller is in another org.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
