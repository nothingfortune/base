name: CI

# The gate, with a doc-only fast path. IMPORTANT: the skip is a job-level
# `if:` on a scope job's output, NEVER a workflow-level path filter — this
# repo's branch protection requires `check / check`, and a path-filtered
# workflow creates no check run at all, leaving the required check "Expected"
# forever and the PR unmergeable. A job skipped via `if:` reports "skipped",
# which branch protection treats as satisfied. The classifier is the shared
# scope.yml; this file picks the fail direction (unknown → full gate).

on:
  push:
    branches: [main]
  pull_request:

# PRs supersede their own runs; every main push gets its own group so none is cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Shared classifier: doc_only is true, false or unknown; unknown runs the full gate below.
  scope:
    uses: nothingfortune/workflows/.github/workflows/scope.yml@125089c3642893f0995161f7eaf16b45df8cf05b # v1.3.0

  # `!cancelled()` is load-bearing: it replaces the implicit success(needs)
  # so a FAILING scope job cannot skip the gate. Without it, scope failing
  # would skip check, "skipped" satisfies branch protection, and a PR could
  # merge with zero checks — the gate must survive its own gatekeeper
  # breaking. (Plain always() would also resist concurrency cancellation,
  # which we want to honor; !cancelled() does not.)
  check:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.doc_only != 'true' }}
    uses: nothingfortune/workflows/.github/workflows/ci.yml@125089c3642893f0995161f7eaf16b45df8cf05b # v1.3.0

  # The doc lane: what a prose change can actually break. Runs only when
  # check skips, so exactly one lane runs per change.
  docs:
    needs: scope
    if: needs.scope.outputs.doc_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run docs:check

  # The REQUIRED aggregate. Branch protection requires `gate` (not check
  # directly): on a doc-only PR `check` skips — and a skipped check satisfies
  # protection — so if `docs` itself is not required, a failing doc lane
  # could not block the merge (Codex, base#7). This job fails unless the
  # lane that was supposed to run actually succeeded, turning "exactly one
  # lane runs" into an enforced invariant rather than a convention.
  # `!cancelled()` again: an upstream failure must surface here, not skip it.
  gate:
    needs: [scope, check, docs]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          DOC_ONLY: ${{ needs.scope.outputs.doc_only }}
          CHECK: ${{ needs.check.result }}
          DOCS: ${{ needs.docs.result }}
        run: |
          echo "doc_only=$DOC_ONLY check=$CHECK docs=$DOCS"
          if [ "$DOC_ONLY" = "true" ]; then
            [ "$DOCS" = "success" ] || { echo "doc lane did not succeed"; exit 1; }
          else
            [ "$CHECK" = "success" ] || { echo "full gate did not succeed"; exit 1; }
          fi
