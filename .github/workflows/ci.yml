name: CI

# The gate, with a doc-only fast path. IMPORTANT: the skip is a job-level
# `if:` on a scope job's output, NEVER a workflow-level path filter — this
# repo's branch protection requires `check / check`, and a path-filtered
# workflow creates no check run at all, leaving the required check "Expected"
# forever and the PR unmergeable. A job skipped via `if:` reports "skipped",
# which branch protection treats as satisfied. Scope logic (and its
# fail-safe direction) lives in .github/scripts/doc-only.sh.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      doc_only: ${{ steps.scope.outputs.doc_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # scope detection diffs against the base commit
      - id: scope
        env:
          # Read via env, never interpolated into the shell. PR: the base
          # branch head; push: the previous head (zero SHA on first push —
          # the script fail-safes to the full gate).
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/doc-only.sh

  # `!cancelled()` is load-bearing: it replaces the implicit success(needs)
  # so a FAILING scope job cannot skip the gate. Without it, scope failing
  # would skip check, "skipped" satisfies branch protection, and a PR could
  # merge with zero checks — the gate must survive its own gatekeeper
  # breaking. (Plain always() would also resist concurrency cancellation,
  # which we want to honor; !cancelled() does not.)
  check:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.doc_only != 'true' }}
    uses: nothingfortune/workflows/.github/workflows/ci.yml@1f28f5a63001481511a35d5d278ec2198a2da245 # v1

  # The doc lane: what a prose change can actually break. Runs only when
  # check skips, so exactly one lane runs per change.
  docs:
    needs: scope
    if: needs.scope.outputs.doc_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
