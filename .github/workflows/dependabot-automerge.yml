name: Dependabot auto-merge

# Auto-merge patch/minor + dev-only majors once checks pass; hold
# production majors with a comment. Meaningful here: this repo has branch
# protection requiring check + e2e, so --auto waits for green.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: nothingfortune/workflows/.github/workflows/dependabot-automerge.yml@125089c3642893f0995161f7eaf16b45df8cf05b # v1.3.0
