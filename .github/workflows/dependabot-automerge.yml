name: Dependabot auto-merge

# Auto-merge patch/minor + dev-only majors once checks pass; hold
# production majors with a comment. Meaningful here: this repo has branch
# protection requiring check + e2e, so --auto waits for green.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: nothingfortune/workflows/.github/workflows/dependabot-automerge.yml@102318a26f52e74480fc0006317dbc6bb4b14897 # v1.1.1
