name: Dependabot auto-merge

# Auto-merge patch/minor + dev-only majors once checks pass; hold
# production majors with a comment. Meaningful here: this repo has branch
# protection requiring check + e2e, so --auto waits for green.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: nothingfortune/workflows/.github/workflows/dependabot-automerge.yml@aa7a3a0ecc927c178fc5f6df2727026234c1145c # v1.2.0
