name: Dependabot auto-merge

# Auto-merge patch/minor + dev-only majors once checks pass; hold
# production majors with a comment. Meaningful here: this repo has branch
# protection requiring check + e2e, so --auto waits for green.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: nothingfortune/workflows/.github/workflows/dependabot-automerge.yml@1f28f5a63001481511a35d5d278ec2198a2da245 # v1
