name: Dependabot auto-merge

# Auto-merge patch/minor + dev-only majors once checks pass; hold
# production majors with a comment. Meaningful here: this repo has branch
# protection requiring check + e2e, so --auto waits for green.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: nothingfortune/workflows/.github/workflows/dependabot-automerge.yml@117db98883af541ea0e5e0092d4a4b208085fcd2 # v1.3.1
